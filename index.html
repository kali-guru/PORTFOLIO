<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Prashant Gurung — Cybersecurity Practitioner | Penetration Testing &amp; Web Security
    </title>
    <meta
      name="description"
      content="Portfolio of Prashant Gurung, a cybersecurity practitioner focused on penetration testing, web application security, vulnerability assessment, and defensive security."
    />
    <meta name="author" content="Prashant Gurung" />
    <meta name="theme-color" content="#0a0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />

    <!-- Canonical + Open Graph + Twitter. Set VITE_SITE_URL at build time (see .env.example). -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prashant Gurung — Security Portfolio" />
    <meta
      property="og:title"
      content="Prashant Gurung — Cybersecurity Practitioner | Penetration Testing & Web Security"
    />
    <meta
      property="og:description"
      content="Ethical hacking, penetration testing, vulnerability assessment, and defensive security. Explore projects, research notes, and security writeups."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Prashant Gurung — Cybersecurity Practitioner | Penetration Testing & Web Security"
    />
    <meta
      name="twitter:description"
      content="Ethical hacking, penetration testing, vulnerability assessment, and defensive security."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Prashant Gurung",
        "jobTitle": "Cybersecurity Practitioner",
        "description": "Cybersecurity practitioner focused on penetration testing, web application security, and defensive security.",
        "url": "%VITE_SITE_URL%/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <style>
        .reveal {
          opacity: 1;
          transform: none;
        }
      </style>
      <div>
        <h1>Prashant Gurung — Cybersecurity Practitioner</h1>
        <p>
          This portfolio is a static site and works best with JavaScript enabled, but the core
          content is: penetration testing, web application security, vulnerability assessment, and
          defensive security.
        </p>
        <p>Contact: [YOUR EMAIL] · GitHub: kali-guru · LinkedIn: [YOUR LINKEDIN]</p>
