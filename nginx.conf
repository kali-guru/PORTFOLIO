# Static portfolio — nginx serves prebuilt files only.
# No backend, no server-side runtime, no vendor-specific routing.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (see SECURITY.md for rationale and CSP notes)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    # NOTE: the single inline application/ld+json block in index.html is metadata,
    # not executable script. If you keep it, add its sha256 hash here, e.g.:
    #   'sha256-<HASH>'
    # or remove the block. See SECURITY.md.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Long-cache hashed build assets; never cache HTML entry points.
    # NOTE: no `add_header` inside location blocks on purpose — any location-level
    # add_header would silently discard ALL server-level security headers above.
    # `expires` sets Cache-Control without affecting header inheritance.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        expires 1d;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
